# Local database only: copy .env.example to .env, set a password, then:
# docker compose up -d
# Run the API locally from Visual Studio or dotnet run.
# Stop with docker compose down. Data stays in the named volume.
# SQL Server Developer edition is for development/testing.
name: levelmovement

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  sqlserver-data:
