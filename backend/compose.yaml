name: levelmovement

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__LevelMovement: 'Server=sqlserver,1433;Database=LevelMovement;User Id=sa;Password="${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}";Encrypt=True;TrustServerCertificate=True;'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  migrate:
    build: .
    image: levelmovement-api:local
    environment: *api-environment
    command: ["--migrate"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: levelmovement-api:local
    environment:
      <<: *api-environment
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: "8443"
      Security__ApiKey: ${Security__ApiKey:-}
      Kestrel__Certificates__Default__Path: /https/localhost.pfx
      # API credentials/certificates are validated at API startup, not SQL-only configuration.
      Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD:-}
    volumes:
      - ./certs/localhost.pfx:/https/localhost.pfx:ro
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8443"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
